/* ============================================================
   M31: АВТОТЕСТЫ
   ============================================================ */
var tests = [];
var currentGroup = 'Общее';
function group(name){ currentGroup = name; }
function test(name, fn){
  tests.push({group:currentGroup, name:name, fn:fn});
}
function assert(cond, msg){
  if(!cond) throw new Error(msg || 'Assertion failed');
}
function assertEq(actual, expected, msg){
  if(actual !== expected) throw new Error((msg?msg+': ':'') + 'ожидалось ' + JSON.stringify(expected) + ', получено ' + JSON.stringify(actual));
}
function assertClose(actual, expected, eps, msg){
  if(Math.abs(actual - expected) > (eps || 0.01)) throw new Error((msg?msg+': ':'') + 'ожидалось ≈' + expected + ', получено ' + actual);
}

/* --- Ждём полной загрузки приложения в iframe --- */
function waitForApp(frame, cb){
  var start = Date.now();
  var iv = setInterval(function(){
    try{
      var w = frame.contentWindow;
      if(w && w.document && w.document.readyState === 'complete' && typeof w.calcInsurance === 'function' && typeof w.calcTax === 'function'){
        clearInterval(iv);
        setTimeout(function(){ cb(w); }, 300); /* даём initApp доработать */
        return;
      }
    }catch(e){}
    if(Date.now() - start > 15000){
      clearInterval(iv);
      document.getElementById('summary').className = 'summary fail';
      document.getElementById('summary').textContent = '✘ Приложение не загрузилось за 15 секунд';
    }
  }, 100);
}

group('Шифрование бэкапа');
test('CryptoUtils.encrypt/decrypt roundtrip', function(w){
  var plain = 'Секретные данные 12345';
  var pw = 'pass123';
  return w.CryptoUtils.encrypt(plain, pw).then(function(payload){
    assert(payload.salt && payload.iv && payload.data, 'payload должен содержать salt/iv/data');
    return w.CryptoUtils.decrypt(payload, pw).then(function(decrypted){
      assertEq(decrypted, plain);
      /* неверный пароль */
      return w.CryptoUtils.decrypt(payload, 'wrong').then(function(){
        throw new Error('должен упасть с неверным паролем');
      }).catch(function(e){
        if(e.message.indexOf('должен упасть') === 0) throw e;
        /* ожидаемо */
      });
    });
  });
});

/* --- Запуск --- */
var results = [];
function renderReport(){
  var passed = results.filter(function(r){return r.ok;}).length;
  var failed = results.length - passed;
  var summary = document.getElementById('summary');
  if(failed === 0){
    summary.className = 'summary ok';
    summary.textContent = '✔ Все тесты пройдены: ' + passed + ' / ' + results.length;
  } else {
    summary.className = 'summary fail';
    summary.textContent = '✘ Провалено ' + failed + ' из ' + results.length + ' (пройдено ' + passed + ')';
  }
  var groups = {};
  results.forEach(function(r){
    if(!groups[r.group]) groups[r.group] = [];
    groups[r.group].push(r);
  });
  var html = '';
  Object.keys(groups).forEach(function(g){
    html += '<div class="group"><div class="group-head">' + g + '</div>';
    groups[g].forEach(function(r){
      html += '<div class="test ' + (r.ok?'ok':'fail') + '">'
        + '<span class="icon">' + (r.ok?'✔':'✘') + '</span>'
        + '<div class="name">' + r.name
        + (r.err ? '<div class="err">' + r.err.replace(/</g,'&lt;') + '</div>' : '')
        + '</div></div>';
    });
    html += '</div>';
  });
  document.getElementById('report').innerHTML = html;
  document.getElementById('meta').textContent = 'Всего: ' + results.length + ' · Пройдено: ' + passed + ' · Провалено: ' + failed;
}
function runAllTests(w){
  var startTime = Date.now();
  var idx = 0;
  function next(){
    if(idx >= tests.length){
      var elapsed = Date.now() - startTime;
      document.getElementById('meta').textContent += ' · ' + elapsed + ' мс';
      renderReport();
      return;
    }
    var t = tests[idx++];
    try{
      var res = t.fn(w);
      if(res && typeof res.then === 'function'){
        res.then(function(){
          results.push({group:t.group, name:t.name, ok:true});
          next();
        }).catch(function(e){
          results.push({group:t.group, name:t.name, ok:false, err:String(e && e.message || e)});
          next();
        });
        return;
      }
      results.push({group:t.group, name:t.name, ok:true});
    }catch(e){
      results.push({group:t.group, name:t.name, ok:false, err:String(e && e.message || e)});
    }
    next();
  }
  next();
}

var frame = document.getElementById('frame');
waitForApp(frame, function(w){
  document.getElementById('meta').textContent = 'Приложение загружено, запуск тестов...';
  runAllTests(w);
});
</script>
